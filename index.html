<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14231a">
<title>Springhaven Sprint</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14231a;color:#f6f2e6;font:15px system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:clamp(12px,3vw,30px)}header,.stats,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header{justify-content:space-between;margin-bottom:12px}h1{font:700 clamp(29px,5vw,50px)/1 Georgia,serif;margin:0 0 6px}p{margin:0;color:#c5d3bc}
.stats{background:#22382a;border-radius:12px 12px 0 0;justify-content:space-between;padding:10px 14px}
.stats span{font-variant-numeric:tabular-nums}.stats small{color:#c5d3bc;margin-right:6px}
.stage{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative;background:#597b4b;overflow:hidden;border-radius:0 0 12px 12px}
canvas{display:block;width:100%;height:clamp(270px,49vh,520px)}#map{position:absolute;right:10px;top:10px;width:110px;height:87px;border-radius:8px;background:#102519da;pointer-events:none}
#message{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:max-content;max-width:90%;padding:10px 16px;text-align:center;border-radius:8px;background:#102519ee;font-weight:700;pointer-events:none}
button{font:inherit;font-weight:650;color:inherit;background:#2a4232;border:1px solid #60755f;border-radius:8px;padding:10px 13px;min-height:44px;cursor:pointer;touch-action:manipulation}
button[aria-pressed=true],#start{background:#f4ce72;color:#162519;border-color:#f4ce72}button:focus-visible{outline:3px solid white;outline-offset:2px}
.touch-zones{position:absolute;inset:0;display:grid;grid-template:2fr 1fr / 1fr 1fr;pointer-events:none}
.touch-zones span{display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:700;text-shadow:0 1px 4px #162519}
.touch-zones [data-zone=right]{justify-content:flex-end}
.touch-zones [data-zone=brake]{grid-column:1/-1;justify-content:center;align-items:flex-end;border-top:1px dashed #fff6;background:#172d2018}
.touch-zones .held{background:#ffe4a035}

footer{margin-top:10px;font-size:13px;color:#c5d3bc}#message:empty{display:none}
@media(max-width:480px){#map{width:82px;height:65px}.stats{font-size:13px;padding:8px}.stats small{margin-right:3px}}
</style>
<main>
<header><div><h1>Springhaven Sprint</h1><p>Front-nine course · 4 tee to the 6 approach</p></div>
<div class="actions" aria-label="Camera"><button id="overhead" aria-pressed="true">Overhead</button><button id="chase" aria-pressed="false">Fly-behind</button><button id="start">Start run</button></div></header>
<div class="stats"><span><small>Time</small><b id="time">0:00.00</b></span><span><small>Best</small><b id="best">—</b></span><span><small>Checkpoints</small><b id="gates">0 / 3</b></span><span><b id="speed">0 mph</b></span></div>
<div class="stage" id="playfield"><canvas id="track" aria-label="Springhaven Sprint race view"></canvas><canvas id="map" width="220" height="174" aria-hidden="true"></canvas><div id="message" role="status">Start run to drive</div><div class="touch-zones" aria-hidden="true"><span data-zone="left">◀ Left</span><span data-zone="right">Right ▶</span><span data-zone="brake">Brake</span></div></div>
<footer>Auto-accelerate · ← / → or A / D to steer · ↓ or Space to brake · R to restart</footer>
</main>
<script src="./course-data.js?v=006b770"></script>
<script>
'use strict';
const byId = id => document.getElementById(id);
const canvas = byId('track');
const ctx = canvas.getContext('2d');
const map = byId('map').getContext('2d');
const roadWidth = 3.3;
const storageKey = 'springhaven-sprint-sector-tipos-v1';
const anchors = springhaven.route;
const road = [];
for (let i = 0; i < anchors.length - 1; i++) {
  const points = [anchors[Math.max(0,i-1)], anchors[i], anchors[i+1], anchors[Math.min(anchors.length-1,i+2)]];
  for (let j = 0; j < 3; j++) {
    const t = j / 3;
    road.push([0,1].map(axis => {
      const [a,b,c,d] = points.map(point => point[axis]);
      return .5 * (2*b + (c-a)*t + (2*a-5*b+4*c-d)*t*t + (3*b-a-3*c+d)*t*t*t);
    }));
  }
}
road.push(anchors.at(-1));
const pointAt = (i, offset = 0, lift = 0) => {
  const [x,z] = road[i];
  const [a,b] = road[Math.max(0,i-1)];
  const [c,d] = road[Math.min(road.length-1,i+1)];
  const angle = Math.atan2(d-b,c-a);
  return [x-Math.sin(angle)*offset, z+Math.cos(angle)*offset, lift];
};
const gateNodes = [199, 331, road.length - 5];
const gateNames = ['4 · Lower sweep','5 · Cart path bend','6 · Finish'];
const grid = springhaven.grid;
const heightBytes = Uint8Array.from(atob(grid.data), char => char.charCodeAt(0));
const heightView = new DataView(heightBytes.buffer);
function terrain(x,z) {
  const col = Math.max(0,Math.min(grid.width-1.001,(x-grid.x)/grid.step));
  const row = Math.max(0,Math.min(grid.depth-1.001,(z-grid.z)/grid.step));
  const i = Math.floor(col), j = Math.floor(row);
  const read = (a,b) => heightView.getInt16((b*grid.width+a)*2,true)/100;
  const a=read(i,j), b=read(i+1,j), c=read(i,j+1), d=read(i+1,j+1);
  const top=a+(b-a)*(col-i), bottom=c+(d-c)*(col-i);
  return top+(bottom-top)*(row-j);
}
function nearest(x,z) {
  let result = { distance: Infinity, index: 0 };
  for (let i = 0; i < road.length-1; i++) {
    const [a,b] = road[i], [c,d] = road[i+1];
    const u = c-a, v = d-b;
    const t = Math.max(0,Math.min(1,((x-a)*u+(z-b)*v)/(u*u+v*v)));
    const distance = Math.hypot(x-a-u*t,z-b-v*t);
    if (distance < result.distance) result = {distance,index:i+t};
  }
  return result;
}
const colors = { fairway:'#83a966', surround:'#94b371', tee:'#a0be77', green:'#b0cd80', sand:'#ebd7a2', water:'#578d9b' };
const layers = Object.entries(colors).flatMap(([kind,color]) =>
  springhaven.holes.flatMap(hole => hole.shapes[kind].map(points => ({
    kind,color,points,
    minX:Math.min(...points.map(p=>p[0])),maxX:Math.max(...points.map(p=>p[0])),
    minZ:Math.min(...points.map(p=>p[1])),maxZ:Math.max(...points.map(p=>p[1]))
  }))));
const hazards = layers.filter(layer => layer.kind === 'sand' || layer.kind === 'water');
const trees = springhaven.trees.map(([x,z,height],i) => [x,z,height*.53,(i%7)/7]);
function covers(layer,x,z) {
  if(x<layer.minX || x>layer.maxX || z<layer.minZ || z>layer.maxZ) return false;
  let inside=false;
  for(let i=0,j=layer.points.length-1;i<layer.points.length;j=i++) {
    const [a,b]=layer.points[i], [c,d]=layer.points[j];
    if((b>z)!==(d>z) && x<(c-a)*(z-b)/(d-b)+a) inside=!inside;
  }
  return inside;
}
const saved = (() => { try { return JSON.parse(localStorage.getItem(storageKey)); } catch { return null; } })();
let best = Number.isFinite(saved?.time) && Array.isArray(saved?.trace) ? saved : null;
let camera = 'overhead', state = 'ready', cart, elapsed, countdown, gate, trace, nextSample, splits;
let width, height, previous, accumulator = 0, cameraYaw;
const held = new Set();
const keyboard = new Set();
const clock = t => {
  const cs = Math.floor(t*100);
  return `${Math.floor(cs/6000)}:${String(Math.floor(cs/100)%60).padStart(2,'0')}.${String(cs%100).padStart(2,'0')}`;
};
function reset(start = false) {
  cart = {x:road[2][0],z:road[2][1],yaw:Math.atan2(road[4][1]-road[2][1],road[4][0]-road[2][0]),speed:0};
  cameraYaw = cart.yaw;
  state = start ? 'countdown' : 'ready';
  elapsed = 0; countdown = 2; gate = 0; trace = [[cart.x,cart.z,cart.yaw]]; nextSample = .1; splits = [];
  byId('message').textContent = start ? '2' : 'Start run to drive';
  byId('start').textContent = start ? 'Restart' : 'Start run';
}
function cameraView(view) {
  camera = view;
  for (const name of ['overhead','chase']) byId(name).setAttribute('aria-pressed',String(name === view));
}
byId('overhead').onclick = () => cameraView('overhead');
byId('chase').onclick = () => cameraView('chase');
byId('start').onclick = () => reset(true);
function control(name) {
  return held.has(name) || [...keyboard].some(key => keys[key] === name);
}
const keys = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'brake',Space:'brake'};
addEventListener('keydown', event => {
  if (event.code === 'KeyR' && !event.repeat) reset(true);
  if (!keys[event.code] || (event.code === 'Space' && event.target instanceof HTMLButtonElement && event.target.closest('.actions'))) return;
  event.preventDefault();
  keyboard.add(event.code);
});
addEventListener('keyup', event => keyboard.delete(event.code));
const playfield = byId('playfield');
const pointers = new Map();
const zoneLabels = document.querySelectorAll('[data-zone]');
function touchZone(x,y,bounds) {
  if (x < bounds.left || x >= bounds.right || y < bounds.top || y >= bounds.bottom) return null;
  if (y >= bounds.top + bounds.height * 2 / 3) return 'brake';
  return x < bounds.left + bounds.width / 2 ? 'left' : 'right';
}
function updateHeldZones() {
  held.clear();
  for (const zone of pointers.values()) if (zone) held.add(zone);
  for (const label of zoneLabels) label.classList.toggle('held',held.has(label.dataset.zone));
}
function movePointer(event) {
  pointers.set(event.pointerId,touchZone(event.clientX,event.clientY,playfield.getBoundingClientRect()));
  updateHeldZones();
}
playfield.onpointerdown = event => {
  if (event.button !== 0) return;
  event.preventDefault();
  playfield.setPointerCapture(event.pointerId);
  movePointer(event);
};
playfield.onpointermove = event => {
  if (pointers.has(event.pointerId)) movePointer(event);
};
function releasePointer(event) {
  pointers.delete(event.pointerId);
  updateHeldZones();
}
playfield.onpointerup = playfield.onpointercancel = playfield.onlostpointercapture = releasePointer;
playfield.oncontextmenu = playfield.onselectstart = event => event.preventDefault();
function clearControls() {
  keyboard.clear();
  pointers.clear();
  updateHeldZones();
}
addEventListener('blur',clearControls);
document.addEventListener('visibilitychange',clearControls);
function finish() {
  state = 'finished';
  const record = !best || elapsed < best.time;
  if (record) {
    best = {time:elapsed,trace};
    try { localStorage.setItem(storageKey,JSON.stringify(best)); } catch {}
  }
  byId('message').textContent = `${record ? 'Personal best' : 'Sector complete'} · ${clock(elapsed)} | Splits ${splits.map(clock).join(' / ')}`;
  byId('start').textContent = 'Race again';
}
function advance(dt) {
  if (state === 'countdown') {
    countdown -= dt;
    if (countdown <= 0) {
      state = 'racing';
      byId('message').textContent = '';
    } else byId('message').textContent = Math.ceil(countdown);
    return;
  }
  if (state !== 'racing') return;
  elapsed += dt;
  const surface = nearest(cart.x,cart.z);
  const onRoad = surface.distance <= roadWidth;
  const hazard = hazards.find(layer => covers(layer,cart.x,cart.z));
  const braking = control('brake');
  const target = braking ? 2.1 : hazard ? 3.8 : onRoad ? 16 : 7;
  const slope = terrain(cart.x+Math.cos(cart.yaw),cart.z+Math.sin(cart.yaw)) - terrain(cart.x,cart.z);
  const rate = cart.speed > target ? (braking ? 19 : 13) : 7.5;
  cart.speed += Math.max(-rate*dt,Math.min(rate*dt,target-cart.speed));
  if (!braking && cart.speed > 3) cart.speed = Math.max(0,cart.speed - slope*dt*3);
  const turn = Number(control('right')) - Number(control('left'));
  cart.yaw += turn * Math.min(1,cart.speed/3) * (2.25 - .035*cart.speed) * dt;
  cameraYaw += Math.atan2(Math.sin(cart.yaw-cameraYaw),Math.cos(cart.yaw-cameraYaw))*Math.min(1,dt*8);
  const oldX = cart.x, oldZ = cart.z;
  cart.x += Math.cos(cart.yaw)*cart.speed*dt;
  cart.z += Math.sin(cart.yaw)*cart.speed*dt;
  const treeHit = trees.some(([x,z]) => (x-cart.x)**2+(z-cart.z)**2 < 1.4);
  if (treeHit || cart.x < 165 || cart.x > 620 || cart.z < 400 || cart.z > 890) {
    cart.x = oldX; cart.z = oldZ; cart.speed = 0;
    byId('message').textContent = 'Steer away or restart';
  } else if (byId('message').textContent) byId('message').textContent = '';
  if (elapsed >= nextSample) {
    trace.push([cart.x,cart.z,cart.yaw]);
    nextSample += .1;
  }
  const i = gateNodes[gate];
  const [x,z] = road[i];
  const [a,b] = road[i-1], [c,d] = road[i+1];
  const length = Math.hypot(c-a,d-b), u = (c-a)/length, v = (d-b)/length;
  const before = (oldX-x)*u+(oldZ-z)*v, after = (cart.x-x)*u+(cart.z-z)*v;
  if (before < 0 && after >= 0 && Math.abs((cart.z-z)*u-(cart.x-x)*v) <= roadWidth+.8) {
    gate++;
    splits.push(elapsed);
    if (gate === gateNodes.length) finish();
  }
}
function projection() {
  const fx = Math.cos(cameraYaw), fz = Math.sin(cameraYaw);
  const scale = Math.min(width/150,height/112);
  if (camera === 'overhead') return (x,z,lift=0) => [
    width/2 + (x-cart.x)*scale, height*.58 + ((z-cart.z)*.82 - (terrain(x,z)-terrain(cart.x,cart.z)+lift)*.34)*scale, 1
  ];
  const eyeX = cart.x-fx*14, eyeZ = cart.z-fz*14, eyeY = terrain(cart.x,cart.z)+10;
  const focal = Math.min(width*1.03,height*1.04);
  return (x,z,lift=0) => {
    const dx=x-eyeX,dz=z-eyeZ,dy=terrain(x,z)+lift-eyeY;
    const forward = dx*fx+dz*fz;
    const depth = forward*.936-dy*.352;
    return [width/2+(-dx*fz+dz*fx)*focal/Math.max(1,depth),
      height*.44-(forward*.352+dy*.936)*focal/Math.max(1,depth),depth];
  };
}
function poly(project, points, color) {
  const vertices = points.map(point => project(...point));
  const visible = [];
  for (let i=0;i<vertices.length;i++) {
    const next=(i+1)%vertices.length;
    const a=vertices[i], b=vertices[next];
    if(a[2]>=1) visible.push(a);
    if((a[2]>=1)!==(b[2]>=1)) {
      // Project the intersection in camera space so paths stay visible under the cart.
      const t=(1-a[2])/(b[2]-a[2]);
      const p=points[i], q=points[next];
      visible.push(project(p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,
        (p[2]??0)+((q[2]??0)-(p[2]??0))*t));
    }
  }
  if(visible.length<3) return;
  ctx.beginPath();
  visible.forEach(([x,z],i) => i ? ctx.lineTo(x,z) : ctx.moveTo(x,z));
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
}
function billboard(project,x,z,top,color,radius) {
  const [sx,sy,depth] = project(x,z,top);
  const [edgeX,edgeY] = project(x+radius,z,top);
  const size = camera === 'chase' ? radius*Math.min(width*1.03,height*1.04)/Math.max(1,depth) : Math.hypot(edgeX-sx,edgeY-sy);
  if (depth < 1 || sx+size < 0 || sx-size > width || sy+size < 0 || sy-size > height) return;
  ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(sx,sy,size,size*.76,0,0,Math.PI*2); ctx.fill();
}
function drawCart(project,x,z,yaw,ghost=false) {
  function layer(halfLength,halfWidth,front,lift,color) {
    const corners = [[front-halfLength,-halfWidth],[front+halfLength,-halfWidth],[front+halfLength,halfWidth],[front-halfLength,halfWidth]];
    poly(project,corners.map(([a,b])=>[x+a*Math.cos(yaw)-b*Math.sin(yaw),z+a*Math.sin(yaw)+b*Math.cos(yaw),lift]),color);
  }
  ctx.globalAlpha = ghost ? .43 : 1;
  layer(1.9,1.1,0,0,'#314438');
  layer(1.65,1.0,0,.7,ghost ? '#66e9ed' : '#c54a2e');
  layer(.98,.91,-.32,1.8,'#fff4c9');
  layer(.28,.73,1.25,.85,ghost ? '#66e9ed' : '#f1b644');
  ctx.globalAlpha = 1;
}
function drawScene() {
  const project = projection();
  ctx.fillStyle = camera === 'overhead' ? '#668b52' : '#a8cad4';
  ctx.fillRect(0,0,width,height);
  if (camera === 'chase') {
    ctx.fillStyle='#668b52'; ctx.fillRect(0,height*.265,width,height);
  }
  for(const layer of layers) {
    if(cart.x < layer.minX-220 || cart.x > layer.maxX+220 || cart.z < layer.minZ-220 || cart.z > layer.maxZ+220) continue;
    poly(project,layer.points,layer.color);
  }
  for (const [half,color] of [[roadWidth+.65,'#445542'],[roadWidth,'#a49f85']]) {
    for(let i=0;i<road.length-1;i++) {
      if(Math.hypot(road[i][0]-cart.x,road[i][1]-cart.z)>240) continue;
      poly(project,[pointAt(i,-half),pointAt(i,half),pointAt(i+1,half),pointAt(i+1,-half)],color);
    }
  }
  for(let i=4;i<road.length-2;i+=9) {
    poly(project,[pointAt(i,-.75,.03),pointAt(i+2,0,.03),pointAt(i,.75,.03),pointAt(i+1,0,.03)],'#f6e8b1');
  }
  gateNodes.forEach((node,index) => {
    const color=index === gate ? '#ffdd77' : '#eae4ca';
    poly(project,[pointAt(node,-roadWidth),pointAt(node,roadWidth),pointAt(node+1,roadWidth),pointAt(node+1,-roadWidth)],color);
  });
  const ghost = state === 'racing' ? best?.trace[Math.floor(elapsed*10)] : null;
  const sprites = trees.filter(([x,z])=>Math.hypot(x-cart.x,z-cart.z)<220).map(([x,z,size,shade])=>({x,z,size,shade}));
  springhaven.holes.forEach(({pin:[x,z],number}) => sprites.push({x,z,flag:number}));
  sprites.push({x:cart.x,z:cart.z,yaw:cart.yaw});
  if (ghost) sprites.push({x:ghost[0],z:ghost[1],yaw:ghost[2],ghost:true});
  sprites.sort((a,b) => camera === 'chase' ? project(b.x,b.z)[2]-project(a.x,a.z)[2] : a.z-b.z);
  for (const item of sprites) {
    if (item.yaw !== undefined) drawCart(project,item.x,item.z,item.yaw,item.ghost);
    else if (item.flag) {
      const [x,y,d] = project(item.x,item.z,3.2);
      const [,base] = project(item.x,item.z);
      if(d>1 && x>-20 && x<width+20) {
        ctx.strokeStyle='#f8f1d8';ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x,y);ctx.stroke();
        ctx.fillStyle='#e3b756';ctx.fillRect(x,y,10,5);
      }
    } else {
      billboard(project,item.x,item.z,0,'#506d42',item.size*.95);
      billboard(project,item.x,item.z,item.size*.95,item.shade>.53?'#3e693c':'#325737',item.size*.8);
      billboard(project,item.x-0.65,item.z-.4,item.size*1.26,'#50804a',item.size*.58);
    }
  }
}
function drawMap() {
  const loc=(x,z)=>[55+x*.18,9+z*.17];
  map.clearRect(0,0,220,174);
  for(const layer of layers) {
    map.beginPath();
    layer.points.forEach(([x,z],i)=>i?map.lineTo(...loc(x,z)):map.moveTo(...loc(x,z)));
    map.closePath(); map.fillStyle=layer.color; map.fill();
  }
  map.strokeStyle='#d4ccb0';map.lineWidth=3;map.beginPath();
  road.forEach(([x,z],i)=>i?map.lineTo(...loc(x,z)):map.moveTo(...loc(x,z)));
  map.stroke();
  gateNodes.forEach((node,i)=>{
    map.fillStyle = i===gate ? '#ffdd77' : '#bbb59b';map.beginPath();map.arc(...loc(...road[node]),4,0,Math.PI*2);map.fill();
  });
  map.fillStyle='#ff7959';map.beginPath();map.arc(...loc(cart.x,cart.z),5,0,Math.PI*2);map.fill();
}
function resize() {
  const rect = canvas.getBoundingClientRect(), ratio = Math.min(2,devicePixelRatio || 1);
  width=rect.width; height=rect.height;
  canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
}
function frame(now) {
  accumulator += Math.min(.1,(now-(previous ?? now))/1000);
  previous = now;
  while(accumulator>=1/60) { advance(1/60); accumulator-=1/60; }
  drawScene(); drawMap();
  byId('time').textContent=clock(elapsed);
  byId('best').textContent=best ? clock(best.time) : '—';
  byId('speed').textContent=`${Math.round(cart.speed*2.237)} mph`;
  byId('gates').textContent=`${gate} / 3`;
  byId('gates').title=gateNames[gate] ?? 'Complete';
  requestAnimationFrame(frame);
}
reset();
new ResizeObserver(resize).observe(canvas);
resize();
requestAnimationFrame(frame);
</script>
</html>
